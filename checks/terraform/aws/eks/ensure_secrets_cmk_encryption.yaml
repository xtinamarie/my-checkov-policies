# Intentionally requires encryption_config to encrypt secrets with a customer managed KMS key (provider.key_arn).
# Clusters omitting encryption_config, omitting provider.key_arn, or setting an empty key_arn are rejected.
#
# Note on unresolved dynamic variables:
# In Checkov's directory runner (HCL), if key_arn = var.something where the variable has
# no default value or tfvars supplied, Checkov cannot resolve the expression and silently drops
# the resource from the scan report rather than flagging it.
# To ensure enforcement when using dynamic variables, run Checkov against the compiled Terraform
# execution plan (tfplan.json), where Terraform resolves all variables and provider defaults.
metadata:
  name: "Ensure EKS secrets are encrypted using a customer managed KMS key"
  id: "CKV_XM_AWS_EKS_51"
  category: "ENCRYPTION"
  severity: "MEDIUM"
  guideline: "https://docs.aws.amazon.com/eks/latest/userguide/kms-encryption.html"
scope:
  provider: terraform
definition:
  and:
    - cond_type: attribute
      resource_types:
        - aws_eks_cluster
      attribute: encryption_config.resources
      operator: contains
      value: "secrets"
    - cond_type: attribute
      resource_types:
        - aws_eks_cluster
      attribute: encryption_config.provider.key_arn
      operator: exists
    - cond_type: attribute
      resource_types:
        - aws_eks_cluster
      attribute: encryption_config.provider.key_arn
      operator: not_equals
      value: ""
