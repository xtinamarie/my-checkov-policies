[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-checkov"
version = "0.1.0"
description = "Checkov wrapper that pre-loads custom policies from this repository"
requires-python = ">=3.9"
dependencies = [
    "checkov>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
mcp = "mcp_cli:main"

[tool.setuptools]
py-modules = ["mcp_cli"]
